<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beauty Salon | Beautiful Hair, Beautiful You</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #222;
      line-height: 1.6;
    }

    /* NAVIGATION */
    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #111;
      padding: 18px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 25px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: #ff8fc7;
    }

    /* HERO */
    .hero {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
        url("https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1600&q=80")
        center/cover;
      color: white;
    }

    .hero-content {
      max-width: 750px;
    }

    .hero h1 {
      font-size: 58px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 21px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #ff4f9a;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      margin: 6px;
      transition: .3s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #e83b86;
    }

    .button.dark {
      background: white;
      color: #111;
    }

    /* GENERAL */
    section {
      padding: 75px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 45px;
    }

    .section-title h2 {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #666;
    }

    /* SERVICES */
    .services {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .service-card {
      background: white;
      padding: 30px 20px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.08);
      transition: .3s;
    }

    .service-card:hover {
      transform: translateY(-7px);
    }

    .service-icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .service-card h3 {
      margin-bottom: 10px;
    }

    .price {
      color: #ff4f9a;
      font-size: 20px;
      font-weight: bold;
      margin-top: 12px;
    }

    /* GALLERY */
    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 16px;
      transition: .3s;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    /* WHY US */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      text-align: center;
    }

    .feature {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,.07);
    }

    .feature span {
      font-size: 35px;
    }

    .feature h3 {
      margin: 15px 0 8px;
    }

    /* CONTACT */
    .contact {
      background: #111;
      color: white;
      text-align: center;
    }

    .contact p {
      margin: 10px 0;
      color: #ddd;
    }

    .contact-buttons {
      margin-top: 25px;
    }

    /* FOOTER */
    footer {
      background: #080808;
      color: #aaa;
      text-align: center;
      padding: 25px;
      font-size: 14px;
    }

    /* MOBILE */
    @media (max-width: 800px) {

      nav {
        flex-direction: column;
        gap: 15px;
      }

      nav ul {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .hero {
        min-height: 75vh;
      }

      .hero h1 {
        font-size: 40px;
      }

      .hero p {
        font-size: 17px;
      }

      .services {
        grid-template-columns: 1fr 1fr;
      }

      .gallery {
        grid-template-columns: 1fr 1fr;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 500px) {

      .services,
      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery img {
        height: 330px;
      }

      section {
        padding: 55px 5%;
      }

      .section-title h2 {
        font-size: 30px;
      }
    }
  </style>
</head>
